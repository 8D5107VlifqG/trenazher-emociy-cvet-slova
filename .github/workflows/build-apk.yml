name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Support Android 6 and newer (minSdk 22)
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle
          grep -n "minSdkVersion\|targetSdkVersion\|compileSdkVersion" android/variables.gradle

      - name: Apply icons and splash
        run: cp -r icons/res/. android/app/src/main/res/

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show minimum Android version of the APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package|sdkVersion|targetSdkVersion" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trenirovka-emociy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
